<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión</title>
</head>
<body>
  <main>
    <h2>Login</h2>

    <div>
      <label for="email">Email <span aria-hidden="true" title="Obligatorio">*</span></label>
      <br>
      <input 
        id="email" 
        type="email" 
        placeholder="ejemplo@correo.com" 
        autocomplete="email" 
        required 
        aria-required="true" 
      />
    </div>
    
    <br>

    <div>
      <label for="password">Contraseña <span aria-hidden="true" title="Obligatorio">*</span></label>
      <br>
      <input 
        id="password" 
        type="password" 
        placeholder="Tu contraseña" 
        autocomplete="current-password" 
        required 
        aria-required="true" 
      />
    </div>

    <br>

    <button id="loginBtn" type="button">Login</button>

    <!-- Usamos aria-live="polite" para que los lectores de pantalla lean el mensaje de error o éxito al actualizarse -->
    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { initApp } from './app.js'
    initApp()
  </script>
</body>
</html>
